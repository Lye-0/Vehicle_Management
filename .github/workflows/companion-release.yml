name: Companion Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract release version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
              throw "タグはSemVer形式のv*タグで指定してください: $tag"
          }

          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build portable Companion package
        shell: pwsh
        env:
          COMPANION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & .\apps\companion\scripts\publish-portable.ps1 -Version $env:COMPANION_VERSION

      - name: Generate SHA-256 checksum
        shell: pwsh
        env:
          COMPANION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zipName = "VehicleManagement.Companion-v$env:COMPANION_VERSION-portable-win-x64.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "apps\companion\dist\$zipName"
          if (-not (Test-Path -LiteralPath $zipPath)) {
              throw "portable ZIPが見つかりません: $zipPath"
          }

          $shaPath = "$zipPath.sha256"
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
              $shaPath,
              "$hash  $zipName`r`n",
              [Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipName = "VehicleManagement.Companion-v$env:COMPANION_VERSION-portable-win-x64.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "apps\companion\dist\$zipName"
          $shaPath = "$zipPath.sha256"

          & gh release create $tag `
              --verify-tag `
              --title "VehicleManagement.Companion v$env:COMPANION_VERSION" `
              --generate-notes `
              $zipPath $shaPath
